services:
  drawdb-api:
    build: .
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Dokploy}
      APP_URL: ${APP_URL:?Set APP_URL to the frontend's public origin}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-}
      AI_ALLOWED_MODELS: ${AI_ALLOWED_MODELS:-}
      AI_MODEL_CAPABILITIES: ${AI_MODEL_CAPABILITIES:-}
      AI_CATALOG_TTL_MS: ${AI_CATALOG_TTL_MS:-60000}
      AI_CATALOG_REFRESH_MIN_MS: ${AI_CATALOG_REFRESH_MIN_MS:-10000}
      AI_CATALOG_TIMEOUT_MS: ${AI_CATALOG_TIMEOUT_MS:-10000}
      AI_GENERATION_TIMEOUT_MS: ${AI_GENERATION_TIMEOUT_MS:-60000}
      AI_MAX_ROUNDS: ${AI_MAX_ROUNDS:-12}
      AI_MAX_PROPOSAL_OPS: ${AI_MAX_PROPOSAL_OPS:-500}
      AI_MAX_CONTEXT_BYTES: ${AI_MAX_CONTEXT_BYTES:-204800}
      AI_MAX_MESSAGE_CHARS: ${AI_MAX_MESSAGE_CHARS:-8000}
      AI_MAX_RECENT_MESSAGES: ${AI_MAX_RECENT_MESSAGES:-20}
      AI_DEFAULT_PAGE_SIZE: ${AI_DEFAULT_PAGE_SIZE:-25}
      AI_MAX_ACTIVE_PER_USER: ${AI_MAX_ACTIVE_PER_USER:-1}
      AI_MAX_ACTIVE_GLOBAL: ${AI_MAX_ACTIVE_GLOBAL:-4}
      AI_RATE_LIMIT_USER_PER_MIN: ${AI_RATE_LIMIT_USER_PER_MIN:-10}
      AI_RATE_LIMIT_PROJECT_PER_MIN: ${AI_RATE_LIMIT_PROJECT_PER_MIN:-30}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
